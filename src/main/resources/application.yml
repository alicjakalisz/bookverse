server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:mem:bookverse-db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      settings:
        trace: true
      path: /h2-console
#      localhost:8080/h2-console

  flyway:
    enabled: false  # 👈 TEMPORARILY DISABLE FLYWAY UNTIL DB IS STABLE
